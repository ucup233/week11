version: '3.8'
services:
  db:
    image: postgres:15-alpine
    container_name: week11-db
    environment:
      POSTGRES_DB: week11
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d week11"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    image: ucupganteng/week11-app:latest
    container_name: week11-app
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:postgresql://db:5432/week11
      - DB_USERNAME=postgres
      - DB_PASSWORD=secretpassword
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
